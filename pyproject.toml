[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fablerapm"
version = "0.1.0"
description = "NBA RAPM pipeline: scrape play-by-play, build exact possession stints, fit ridge-regression RAPM with offensive/defensive splits per 100 possessions"
requires-python = ">=3.9"
dependencies = [
    "pbpstats>=1.3.11",
    "requests>=2.28",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fablerapm = "fablerapm.cli:main"

[tool.setuptools.packages.find]
include = ["fablerapm*"]
